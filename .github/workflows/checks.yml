name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 -B -m unittest discover -s tests -p test_archive_prompts.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
