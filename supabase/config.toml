project_id = "hackaton-lepv-base"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://eai-lepv.vercel.app"
additional_redirect_urls = [
  "https://eai-lepv.vercel.app/auth/callback",
  "https://hackaton-lepv.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback"
]
# Contas e convites são provisionados pelo servidor/coordenador autorizado.
enable_signup = false

